# Glow App 配置文件 - Simple App 示例
#
# 使用方法：
#   1. glow apply -f deploy.yaml         # 应用配置并绑定资源
#   2. glow start app simple-app         # 启动应用
#   3. curl http://app.local            # 访问应用（需配置 /etc/hosts）
#
# 说明：
# - 这是 simple-app 的完整配置示例
# - 包含 HTTP 服务、Ingress（域名绑定）和 MySQL 数据库
# - 所有资源通过声明式 YAML 配置

apiVersion: v1
kind: App
metadata:
  name: simple-app
spec:
  # 应用执行配置
  binary: ./simple-app
  workingDir: .

  # HTTP 服务端口
  # 应用通过 glowhttp.Init(33203) 声明端口
  # glow-server 会设置 OP_APP_PORT=33203 环境变量
  port: 33203

  # Ingress 配置
  # 绑定域名 app.local，需要同时在 /etc/hosts 中添加：
  # 127.0.0.1 app.local
  domain: app.local

  # 资源声明
  resources:
    # MySQL 数据库
    # 应用代码中使用 glowmysql.Init("simple_app_db")
    # glow apply 会自动创建数据库并生成 DSN 写入配置文件
    mysql:
      - dbName: simple_app_db

# 配置文件生成位置：
#   /var/lib/glow-server/apps/simple-app/simple-app_local_config.json
#
# 生成的配置文件包含：
#   {
#     "mysql": {
#       "dsn": "user:pass@tcp(localhost:3306)/simple_app_db"
#     }
#   }
#
# 应用运行时从本地配置文件读取，无需连接 glow-server
