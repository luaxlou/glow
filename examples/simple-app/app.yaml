# Glow App 配置文件
#
# 使用方法：
#   1. 构建应用: ./scripts/deploy.sh          # 自动构建并部署
#   2. 应用配置: glow apply -f app.yaml       # 应用配置并绑定资源
#   3. 启动应用: glow start app simple-app  # 启动应用
#   4. 查看状态: glow get app simple-app     # 查看应用状态
#
# 说明：
# - 应用使用 MySQL 和 HTTP 服务
# - Ingress（域名绑定）通过 spec.domain 声明
# - 资源绑定通过 spec.resources 声明
# - binary 和 workingDir 采用约定大于配置原则（可省略）

apiVersion: v1
kind: App
metadata:
  name: simple-app
spec:
  # 应用执行配置（约定大于配置）
  # binary: 默认为 <data-dir>/apps/<app-name>/<app-name>
  # workingDir: 默认为 <data-dir>/apps/<app-name>
  # 因此可以省略这两个字段

  args: []

  # 环境变量（可选）
  env:
    - name: ENV
      value: development
    - name: LOG_LEVEL
      value: debug

  # 应用配置（可选）⭐
  # 这些配置会写入到 <data-dir>/apps/<app-name>/<app-name>_local_config.json
  # 应用代码可以使用 glowconfig 读取这些配置
  config:
    # 数据库配置（用户自行提供）
    mysql_dsn: "root:password@tcp(localhost:3306)/simple-app_db"

    # Redis 配置（用户自行提供）
    redis_addr: "localhost:6379"

    # 应用配置
    log_level: "debug"
    max_connections: 100

  # HTTP 服务端口
  # 应用会通过 OP_APP_PORT 环境变量收到端口 33302
  port: 33302

  # Ingress 配置（可选）
  # 指定 domain 后，glow-server 会自动配置 Nginx 反向代理
  # domain: simple-app.local
